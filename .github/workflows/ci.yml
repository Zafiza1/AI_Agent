name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: testing
          POSTGRES_PASSWORD: testing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testing" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      matrix:
        database: [sqlite, pgsql]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_sqlite, intl, zip, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - name: Tests (SQLite)
        if: matrix.database == 'sqlite'
        run: php artisan test
      - name: Tests (PostgreSQL)
        if: matrix.database == 'pgsql'
        # phpunit.xml forces SQLite for safety; derive a config that targets the CI database.
        run: |
          sed -e 's/name="DB_CONNECTION" value="sqlite"/name="DB_CONNECTION" value="pgsql"/' \
              -e 's/name="DB_DATABASE" value=":memory:"/name="DB_DATABASE" value="testing"/' phpunit.xml > phpunit.pgsql.xml
          php artisan test --configuration=phpunit.pgsql.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_USERNAME: testing
          DB_PASSWORD: testing

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  agent:
    name: Agent engine (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
