# Development stack. Start everything with:  docker compose up -d
# Dashboard: http://localhost:5173   API: http://localhost:8000   Agent: http://localhost:8001

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend/Dockerfile
  image: maintenance-platform/backend:dev
  volumes:
    - ./backend:/var/www/html
    # vendor/ lives in a volume: reading it through a Windows/WSL bind mount makes every request take seconds.
    - backend_vendor:/var/www/html/vendor
  environment: &backend-env
    APP_ENV: local
    # Let `artisan serve` handle concurrent requests (the dashboard fires several at once).
    PHP_CLI_SERVER_WORKERS: 4
    APP_URL: http://localhost:${BACKEND_PORT:-8000}
    FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB:-maintenance}
    DB_USERNAME: ${POSTGRES_USER:-maintenance}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-maintenance}
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    AGENT_ENGINE_URL: http://agent:8001
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  backend:
    <<: *backend
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "true"
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=10", "--max-time=3600"]
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    image: maintenance-platform/agent:dev
    volumes:
      - ./agent:/app
    environment:
      AGENT_ENV: local
      AGENT_CONTROL_PLANE_URL: http://backend:8000
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      AGENT_REDIS_URL: redis://redis:6379/1
    ports:
      - "${AGENT_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: maintenance-platform/frontend:dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maintenance}
      POSTGRES_USER: ${POSTGRES_USER:-maintenance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maintenance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  backend_vendor:
  postgres_data:
  redis_data:
  frontend_node_modules:
